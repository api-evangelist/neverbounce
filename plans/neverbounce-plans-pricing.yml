api_relevant_notes:
- >-
  Billing is per verification credit and is charged on the API surface: each
  /single/check call costs 1 credit, "including duplicate verification requests and bad
  syntax data" (https://developers.neverbounce.com/reference/single).
- >-
  Remaining balance is readable from the API — /account/info returns paid and free credits
  used and remaining, and /single/check accepts `credits_info=1` to return the same
  counters inline.
- >-
  The free list analysis runs as a job sample (`job_sample_started` /
  `job_sample_finished` callbacks) before credits are spent on a full run.
