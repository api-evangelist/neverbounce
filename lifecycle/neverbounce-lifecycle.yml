  events:
  - version: v3
    state: retired
    detail: >-
      The legacy V3 API is retired for new integrations and its credentials are explicitly
      rejected by V4: an 8-character username or 12–16 character secret key returns
      `auth_failure`. The V3 documentation is still linked from the getting-started page as
      "legacy API (V3) docs".
    source: https://developers.neverbounce.com/reference/authentication
  - version: v4.2
    state: breaking-change
    detail: >-
      The `acedemic_host` verification flag was renamed to `academic_host`, marked
      [Breaking] in the changelog. Jobs also stopped being eligible for manual review by
      default — that behaviour now requires opt-in at job creation.
    source: https://developers.neverbounce.com/changelog/version-42
  note: >-
    There is a written versioning-and-breaking-change policy and a dated changelog, and
    breaking changes are labelled as such. What is missing is machine-readable signalling:
    no Sunset or Deprecation response headers, no `deprecated: true` on any operation in
    the published OpenAPI definition, and no dates attached to retirement.
